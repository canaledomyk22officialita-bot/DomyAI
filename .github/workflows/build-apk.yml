name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Crea la parte Android del progetto
        run: |
          flutter create --org it.domyk22 --project-name domyai_server --platforms android /tmp/app
          cp -r /tmp/app/android ./android
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' android/app/src/main/AndroidManifest.xml

      - name: Compila llama.cpp per arm64
        run: |
          git clone --depth 1 https://github.com/ggml-org/llama.cpp
          cmake -S llama.cpp -B build-android \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-29 \
            -DBUILD_SHARED_LIBS=ON -DGGML_OPENMP=OFF \
            -DLLAMA_CURL=OFF -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_SERVER=OFF
          cmake --build build-android --config Release -j4
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          find build-android -name '*.so' -exec cp {} android/app/src/main/jniLibs/arm64-v8a/ \;
          ls -la android/app/src/main/jniLibs/arm64-v8a

      - name: Compila l'APK
        run: |
          flutter pub get
          flutter build apk --release --target-platform android-arm64

      - uses: actions/upload-artifact@v4
        with:
          name: domyai-server-apk
          path: build/app/outputs/flutter-apk/app-release.apk
